name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ts
      - run: ./scripts/scan_secrets.sh
